name: Sonda export Normattiva

# Misura le modalità di export per progettare la pipeline (Task 1.1). Da togliere a pipeline conclusa.
on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-ubyye7]
    paths:
      - "ingest/sonda_export.py"
      - ".github/workflows/sonda-export.yml"

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: ingest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python sonda_export.py
