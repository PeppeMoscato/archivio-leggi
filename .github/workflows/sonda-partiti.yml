name: Sonda rapporti tra i partiti

# Controlla le fonti sui rapporti tra i partiti (Wikidata, ParlGov, Eligendo, Camera, Senato)
# e pubblica il report nel riepilogo del job. Non scrive su nessun database.
on:
  workflow_dispatch:
    inputs:
      parti:
        description: 'Parti da sondare, JSON: ["wikidata", "parlgov", "eligendo", "camera", "senato", "governi"]'
        default: '["governi"]'
  pull_request:
    paths:
      - "ingest/sonda_partiti.py"
      - ".github/workflows/sonda-partiti.yml"

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        parte: ${{ fromJSON(inputs.parti || '["governi"]') }}
    defaults:
      run:
        working-directory: ingest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python sonda_partiti.py ${{ matrix.parte }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sonda-partiti-${{ matrix.parte }}
          path: ingest/samples/sonda_partiti_${{ matrix.parte }}.json
          if-no-files-found: warn
