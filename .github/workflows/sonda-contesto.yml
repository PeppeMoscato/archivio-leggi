name: Sonda contesto delle leggi

# Cerca dove stanno premesse, relazioni illustrative e dossier (Normattiva, Senato, Camera)
# e pubblica il report nel riepilogo del job.
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths:
      - "ingest/sonda_contesto.py"
      - ".github/workflows/sonda-contesto.yml"
  pull_request:
    paths:
      - "ingest/sonda_contesto.py"
      - ".github/workflows/sonda-contesto.yml"

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        parte: [normattiva, senato, camera]
    defaults:
      run:
        working-directory: ingest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
        if: matrix.parte == 'normattiva'
      - run: python sonda_contesto.py ${{ matrix.parte }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sonda-contesto-${{ matrix.parte }}
          path: ingest/samples/sonda_contesto.json
          if-no-files-found: warn
