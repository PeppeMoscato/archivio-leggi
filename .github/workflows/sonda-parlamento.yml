name: Sonda Camera e Senato

# Interroga gli endpoint SPARQL di dati.camera.it e dati.senato.it e pubblica il report
# nel riepilogo del job (Task 1.2: schema v1.2 per iter e votazioni).
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "ingest/sonda_parlamento.py"
      - ".github/workflows/sonda-parlamento.yml"

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        ramo: [camera, senato-mirate]
    defaults:
      run:
        working-directory: ingest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python sonda_parlamento.py ${{ matrix.ramo }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sonda-${{ matrix.ramo }}
          path: ingest/samples/sonda_parlamento.json
          if-no-files-found: warn
